# Gera os dados do site a partir dos arquivos oficiais do TSE e do IBGE e publica no GitHub
# Pages. Os dados gerados (~18 mil arquivos) não ficam no repositório: qualquer pessoa pode
# refazê-los a partir das fontes com os mesmos dois comandos.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Um push novo espera o anterior terminar: cancelar no meio poderia interromper uma publicação.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      # raw/ (~470 MB) fica em cache. A chave muda toda semana, e no meio da semana o fetch.sh
      # só baixa de novo o que o TSE tiver mudado (curl -z). Assim um push que só mexe no
      # texto não depende do TSE estar no ar nem baixa tudo outra vez.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: raw
          key: raw-${{ hashFiles('scripts/fetch.sh') }}-${{ steps.week.outputs.week }}
          restore-keys: raw-${{ hashFiles('scripts/fetch.sh') }}-
      - run: ./scripts/fetch.sh
      - run: go run ./cmd/reduto
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
